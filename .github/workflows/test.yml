# Typecheck, lint, build and the end-to-end suite, on every pull request.
#
# The `test` job is a required check on develop and main. Like the contract check in the
# system repository, it runs on every pull request with no paths filter: GitHub cannot tell
# "filtered out" from "not reported yet", and a required check that never reports blocks
# the merge forever.
#
# There is no separate build step: the Playwright config builds the site for production
# and serves it, next to the mock API and a Keycloak container on the runner's Docker.
# Node has to be on the PATH. Without it Bun stands in for `node`, and `next build` fails.

name: Test

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  # The contract package lives in GitHub Packages, private to the organisation.
  packages: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      # Same pin as the system repository's workflows.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build and run the end-to-end suite
        run: bun run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
